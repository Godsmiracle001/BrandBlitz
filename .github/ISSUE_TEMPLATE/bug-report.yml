name: "Bug Report"
description: Something that was working and now isn't, or produces incorrect output.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a clear and concise report to help us resolve the issue quickly.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you doing when the bug occurred?
      placeholder: e.g., "Starting a challenge from the leaderboard page"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: relevant-files
    attributes:
      label: Relevant Files
      description: Which files or directories are involved?
      placeholder: "e.g., apps/web/src/hooks/useGameSession.ts"
  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: Links to logs, screenshots, or related issues.
